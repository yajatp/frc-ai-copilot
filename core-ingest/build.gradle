// Module 1 — Ingestion & storage core.
apply plugin: 'application'

dependencies {
    // WPILib log parsing (DataLogReader) + geometry/struct decoding.
    implementation "edu.wpi.first.wpiutil:wpiutil-java:${wpilibVersion}"
    implementation "edu.wpi.first.wpimath:wpimath-java:${wpilibVersion}"
    implementation "edu.wpi.first.wpiunits:wpiunits-java:${wpilibVersion}" // units types on the geometry API
    implementation 'us.hebi.quickbuf:quickbuf-runtime:1.4' // wpimath geometry static init (protobuf)

    // Persistent trend store + config parsing.
    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.13' // silence sqlite-jdbc's optional SLF4J binding

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.mercsmavs.frccopilot.ingest.Cli'
}

// --- WPILib desktop native libraries (wpiutiljni, etc.) ---
// DataLogWriter and ntcore need the JNI natives. Pull this platform's desktop native zip and flatten
// the shared libraries into build/natives, then point java.library.path there. The classifier and
// file extension come from rootProject.wpiNative* so this works on macOS, Windows and Linux alike.
// Everything stays local.
configurations {
    natives
}

dependencies {
    natives "edu.wpi.first.wpiutil:wpiutil-cpp:${wpilibVersion}:${rootProject.wpiNativeClassifier}@zip"
}

def nativesDir = layout.buildDirectory.dir('natives')

def extractNatives = tasks.register('extractNatives', Copy) {
    from { configurations.natives.collect { zipTree(it) } }
    include rootProject.wpiNativePattern
    eachFile { it.path = it.name } // flatten so java.library.path is a single dir
    includeEmptyDirs = false
    into nativesDir
}

tasks.withType(Test).configureEach {
    dependsOn extractNatives
    systemProperty 'java.library.path', nativesDir.get().asFile.absolutePath
}

tasks.named('run') {
    dependsOn extractNatives
    systemProperty 'java.library.path', nativesDir.get().asFile.absolutePath
}

distributions {
    main {
        contents {
            from(nativesDir) { into 'natives' }
        }
    }
}

['installDist', 'distTar', 'distZip'].each { t -> tasks.named(t) { dependsOn extractNatives } }

tasks.named('startScripts') {
    dependsOn extractNatives
    doLast {
        unixScript.text = unixScript.text.replace(
                'exec "$JAVACMD" "$@"',
                'exec "$JAVACMD" "-Djava.library.path=$APP_HOME/natives" "$@"')
        windowsScript.text = windowsScript.text.replace(
                '"%JAVA_EXE%" %DEFAULT_JVM_OPTS%',
                '"%JAVA_EXE%" "-Djava.library.path=%APP_HOME%\\natives" %DEFAULT_JVM_OPTS%')
    }
}

