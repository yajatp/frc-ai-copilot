org.gradle.jvmargs=-Xmx1g
org.gradle.caching=true

wpilibVersion=2026.2.1
maplesimVersion=0.4.0-beta

# NOTE: org.gradle.java.home is deliberately NOT set here.
#
# It used to be pinned to one contributor's absolute home directory, which meant a fresh clone built
# on exactly one machine. The JDK now comes from JAVA_HOME instead, which every platform's WPILib
# install provides:
#
#   macOS / Linux:  export JAVA_HOME=~/wpilib/2026/jdk
#   Windows:        $env:JAVA_HOME = "$HOME\wpilib\2026\jdk"
#
# If you would rather not export it per shell, set org.gradle.java.home in your OWN
# ~/.gradle/gradle.properties (a user-level file, outside the repo) rather than here — putting a
# machine-specific path back in this file breaks everyone else.
#
# Keep GRADLE_USER_HOME pointed inside the checkout as well; see CONTRIBUTING.md.
