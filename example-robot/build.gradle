// A small, self-contained WPILib command-based robot that runs headless in the WPILib simulation
// HAL and produces a real .wpilog — used to demonstrate the agentic closed loop end-to-end.
apply plugin: 'application'

dependencies {
    implementation "edu.wpi.first.wpilibj:wpilibj-java:${wpilibVersion}"
    implementation "edu.wpi.first.wpilibNewCommands:wpilibNewCommands-java:${wpilibVersion}"
    implementation "edu.wpi.first.wpimath:wpimath-java:${wpilibVersion}"
    implementation "edu.wpi.first.hal:hal-java:${wpilibVersion}"
    implementation "edu.wpi.first.ntcore:ntcore-java:${wpilibVersion}"
    implementation "edu.wpi.first.cameraserver:cameraserver-java:${wpilibVersion}"
    implementation "edu.wpi.first.cscore:cscore-java:${wpilibVersion}"
    implementation "edu.wpi.first.wpiutil:wpiutil-java:${wpilibVersion}"
    implementation "edu.wpi.first.wpiunits:wpiunits-java:${wpilibVersion}"
    implementation 'us.hebi.quickbuf:quickbuf-runtime:1.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.2'

    // maple-sim: physics-based (dyn4j) swerve drivetrain simulation, so the headless demo drives a
    // real simulated chassis instead of an odometry-free mechanism stub.
    implementation "org.ironmaple:maplesim-java:${maplesimVersion}"
    implementation 'org.dyn4j:dyn4j:5.0.2'
    implementation 'org.ejml:ejml-simple:0.44.0' // maplesim-java's own build depends on this but its published pom omits it

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.mercsmavs.frccopilot.examplerobot.HeadlessSim'
}

configurations {
    natives
}

dependencies {
    natives "edu.wpi.first.hal:hal-cpp:${wpilibVersion}:osxuniversal@zip"
    natives "edu.wpi.first.wpimath:wpimath-cpp:${wpilibVersion}:osxuniversal@zip"
    natives "edu.wpi.first.ntcore:ntcore-cpp:${wpilibVersion}:osxuniversal@zip"
    natives "edu.wpi.first.wpinet:wpinet-cpp:${wpilibVersion}:osxuniversal@zip"
    natives "edu.wpi.first.wpiutil:wpiutil-cpp:${wpilibVersion}:osxuniversal@zip"
}

def nativesDir = layout.buildDirectory.dir('natives')

def extractNatives = tasks.register('extractNatives', Copy) {
    from { configurations.natives.collect { zipTree(it) } }
    include '**/*.dylib'
    eachFile { it.path = it.name }
    includeEmptyDirs = false
    into nativesDir
}

tasks.named('run') {
    dependsOn extractNatives
    systemProperty 'java.library.path', nativesDir.get().asFile.absolutePath
}

tasks.withType(Test).configureEach {
    dependsOn extractNatives
    systemProperty 'java.library.path', nativesDir.get().asFile.absolutePath
}

distributions {
    main {
        contents {
            from(nativesDir) { into 'natives' }
        }
    }
}

['installDist', 'distTar', 'distZip'].each { t -> tasks.named(t) { dependsOn extractNatives } }

tasks.named('startScripts') {
    dependsOn extractNatives
    doLast {
        unixScript.text = unixScript.text.replace(
                'exec "$JAVACMD" "$@"',
                'exec "$JAVACMD" "-Djava.library.path=$APP_HOME/natives" "$@"')
        windowsScript.text = windowsScript.text.replace(
                '"%JAVA_EXE%" %DEFAULT_JVM_OPTS%',
                '"%JAVA_EXE%" "-Djava.library.path=%APP_HOME%\\natives" %DEFAULT_JVM_OPTS%')
    }
}

// A second launcher for the replay entry point, so `replay.yaml` can invoke it directly the way
// `loop.yaml` invokes the sim. Same natives rewrite — a replay pass still needs the HAL.
def replayScripts = tasks.register('replayStartScripts', CreateStartScripts) {
    dependsOn extractNatives
    mainClass = 'org.mercsmavs.frccopilot.examplerobot.ReplaySim'
    applicationName = 'example-robot-replay'
    outputDir = layout.buildDirectory.dir('scripts-replay').get().asFile
    classpath = tasks.named('startScripts').get().classpath
    doLast {
        unixScript.text = unixScript.text.replace(
                'exec "$JAVACMD" "$@"',
                'exec "$JAVACMD" "-Djava.library.path=$APP_HOME/natives" "$@"')
        windowsScript.text = windowsScript.text.replace(
                '"%JAVA_EXE%" %DEFAULT_JVM_OPTS%',
                '"%JAVA_EXE%" "-Djava.library.path=%APP_HOME%\\natives" %DEFAULT_JVM_OPTS%')
    }
}

distributions {
    main {
        contents {
            from(replayScripts) { into 'bin' }
        }
    }
}

