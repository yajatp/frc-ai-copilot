distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# The official Gradle 8.11 distribution.
#
# This used to point at file:/Users/<someone>/wpilib/2026/installUtils/gradle-8.11-bin.zip, to avoid
# needing the network. That path exists on exactly one machine, so a fresh clone by anyone else — or
# by CI — failed before Gradle even started. The offline saving was not worth a project nobody else
# could build.
#
# The bytes are the same either way: WPILib ships the official distribution unmodified (verified by
# SHA-256 against services.gradle.org). The checksum below is enforced by the wrapper, so a corrupted
# or substituted download fails loudly instead of executing.
#
# To build fully offline, point this at your own WPILib copy:
#   macOS/Linux  file:/<home>/wpilib/2026/installUtils/gradle-8.11-bin.zip
#   Windows      file:/C:/Users/<you>/wpilib/2026/installUtils/gradle-8.11-bin.zip
# Just don't commit that — it is a machine-specific path.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11-bin.zip
distributionSha256Sum=57dafb5c2622c6cc08b993c85b7c06956a2f53536432a30ead46166dbca0f1e9
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
